<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10262E" />
    <title>Crystal Alamein — Explore the Building</title>
    <meta name="description" content="Explore Crystal Alamein by Darak Developments floor by floor: choose a floor on the building, then an apartment on the plan." />
    <link rel="icon" type="image/png" href="assets/brand/crystal-dark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <!-- No framework, no build. The only library (GSAP) loads from the jsDelivr CDN. -->
    <script type="importmap">
      { "imports": { "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.15.0/index.js" } }
    </script>
    <link rel="preload" as="image" href="assets/renders/night.webp" media="(min-width: 1100px)" />
    <link rel="preload" as="image" href="assets/renders/night-sm.webp" media="(max-width: 1099px)" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>This building explorer needs JavaScript enabled.</noscript>
  </body>
</html>
